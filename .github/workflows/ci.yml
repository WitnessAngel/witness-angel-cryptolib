name: CI

on:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install tox
      - run: python -m tox -e py  # "py" = the interpreter setup-python just installed

  test-fallback:  # Pure-python crypto backend (pycryptodome uninstalled), e.g. to check the compatibility corpus there
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install tox
      - run: python -m tox -e py311-fallback

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install tox
      - run: python -m tox -e doc

  c-flightbox:  # Flightbox C encryptor: build matrix, unit tests, fuzz smoke runs, Cortex-M4 builds, interop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc clang-18 libclang-rt-18-dev gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: python -m pip install tox
      - run: python -m tox -e c_flightbox
        env:
          WA_CLANG: clang-18

  rust-flightbox:  # Flightbox Rust encryptor: both backends, single-format builds, fuzz smoke runs, Cortex-M builds, interop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev binutils-arm-none-eabi
      # The stable toolchain and its embedded targets come from reimplementations/rust/rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: reimplementations/rust
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install --locked cargo-fuzz cargo-deny
      - run: python -m pip install tox
      - run: python -m tox -e rust_flightbox
        env:
          WA_REQUIRE_ALL_STEPS: "1"
