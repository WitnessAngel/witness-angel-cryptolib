[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "wacryptolib"
description = "Witness Angel Cryptolib"
version = "0.12"
license = "GPL-2.0-or-later"
readme = "Readme.rst"
authors = ["Pascal Chambon", "Manon Michelet", "Akram Bourichi", "Francinette Atchade"]
homepage = "https://witnessangel.com/"
repository = "https://github.com/WitnessAngel/witness-angel-cryptolib"
documentation = "https://witness-angel-cryptolib.readthedocs.io/"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
]
include = []
exclude = []

[tool.poetry.scripts]
flightbox = 'wacryptolib.cli:main'

[tool.poetry.dependencies]
python = ">=3.10, <4.0"

# Cryptography & utilities
pycryptodome = "^3.9.9"

click = "^8.0"
click-log = "^0.4.0"
prettytable = "^3.6.0"  # For CLI too

multitimer = "^0.3"  # Requires THREADS capability
jsonrpc-requests = "^0.4.0"  # Requires REQUESTS package

jsonschema = "^4.25.1"  # Actually optional

psutil = { version = "^7" }  # Use on Win32 too for get_memory_rss_bytes()()
wmi = { version = "^1.5.1 ", platform = 'win32' }
pywin32 = { version = ">=300", platform = 'win32' }
pyudev = { version = "^0.22.0 ", platform = 'linux' }

# VENDORED DEPENDENCIES
# uuid0 = "^0.2.7"
# schema = "^0.7.7"
# decorator = "^5.1"

[tool.poetry.group.dev.dependencies]

# Test runners and plugins
pytest = ">=7.0.1"
pytest-cov = ">=4.0"
pytest-env = ">=1.0.1"
pytest_mock = ">=3.7.0"
pytest-randomly = ">=3.11"
pytest-deadfixtures = ">=2.2.1"
pytest-timeout = ">=2.1.0"
pytest-xdist = ">=3.0.0"
responses = ">=0.18.0"
freezegun = ">=1.1.0"
typeguard = ">=2.13.0"
pytz = ">=2021.3"

# Linters and formatters
black = { version = ">=22.1.0" }
darglint = ">=1.8.1"
pylint = ">=2.6"
mypy = ">=0.931"
xenon = ">=0.9.0"
doc8 = ">=0.10.1"
safety = ">=1.10"
ruamel-yaml-clib = ">=0.2.12"  # To help "safety" be compatible with python 3.13

# Documentation
sphinx = ">=4.4.0"
sphinx-autodoc-typehints = ">=1.17.0"
sphinx_rtd_theme = ">=1.0.0"
sphinx-click = ">=4.4.0"
sphinxcontrib-programoutput = ">=0.17"
roman-numerals = "4.0.0"  # Downgraded for https://github.com/sphinx-doc/sphinx/issues/14186
toml = ">=0.10.2"

# Install these with pip for manual benchmarks
#memory-profiler = "^0.58.0"
#matplotlib = "^3.4.3"
#pytest-profiling = "^1.7.0"
