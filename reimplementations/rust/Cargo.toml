[workspace]
resolver = "3"
members = [
    "wa_flightbox",
    "wa_flightbox_backend_rustcrypto",
    "wa_flightbox_backend_wolfcrypt",
    "wa_flightbox_backend_conformance",
    "wa_flightbox_host_tools",
    "wa_flightbox_footprint_probe",
]
# Without the wolfCrypt backend, which needs a wolfSSL source tree (WA_WOLFSSL_SOURCE_DIR) and libclang: plain
# `cargo build` and `cargo test` leave it out, `--workspace` includes it
default-members = [
    "wa_flightbox",
    "wa_flightbox_backend_rustcrypto",
    "wa_flightbox_backend_conformance",
    "wa_flightbox_host_tools",
    "wa_flightbox_footprint_probe",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-2.0-or-later"
authors = ["Prolifik SARL"]
repository = "https://github.com/WitnessAngel/witness-angel-cryptolib"
publish = false

[workspace.dependencies]
wa_flightbox = { path = "wa_flightbox", default-features = false }
wa_flightbox_backend_rustcrypto = { path = "wa_flightbox_backend_rustcrypto" }
wa_flightbox_backend_wolfcrypt = { path = "wa_flightbox_backend_wolfcrypt" }
wa_flightbox_backend_conformance = { path = "wa_flightbox_backend_conformance" }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Device builds (design D12): size first, no unwinding
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
