[package]
name = "wa_flightbox_backend_rustcrypto"
description = "Pure-Rust crypto backend of the Witness Angel flightbox encryptor, over the RustCrypto crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wa_flightbox.workspace = true
zeroize.workspace = true
aes = { version = "0.9", default-features = false, features = ["zeroize"] }
chacha20 = { version = "0.10", default-features = false, features = ["cipher", "zeroize"] }
poly1305 = { version = "0.9", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets", "zeroize"] }
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc", "zeroize"] }
ml-kem = { version = "0.3", default-features = false, features = ["hazmat", "zeroize"] }

[dev-dependencies]
# A document format, so that the conformance suite also checks encryptors over the backend
wa_flightbox = { workspace = true, features = ["wa-cbor"] }
wa_flightbox_backend_conformance.workspace = true

[lints]
workspace = true
