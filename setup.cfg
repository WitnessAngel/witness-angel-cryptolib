# All configuration for plugins and other utils is defined here.
# Read more about `setup.cfg`:
# https://docs.python.org/3/distutils/configfile.html


[coverage:run]
branch = True
omit =


# pytest config moved to pyproject.toml [tool.pytest.ini_options]
# (pytest only reads one ini source, and pyproject.toml already defines one)


[darglint]
docstring_style=sphinx
# We can have long docstrings without argument/return annotations
strictness=long
# We ignore missing arguments/return annotations, not abnormal one
ignore=DAR002,DAR101,DAR201,DAR401


[isort]
# See https://github.com/timothycrosley/isort#multi-line-output-modes
multi_line_output = 3
include_trailing_comma = true
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = FIRSTPARTY
# Should be: 80 - 1
line_length = 79


[mypy]
# The mypy configurations: https://mypy.readthedocs.io/en/latest/config_file.html
python_version = 3.11

check_untyped_defs = True
disallow_any_explicit = True
disallow_any_generics = False
disallow_untyped_calls = True
disallow_untyped_decorators = True
ignore_errors = False
ignore_missing_imports = True
strict_optional = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True


[doc8]
ignore-path = docs/_build
max-line-length = 1000
sphinx = True
