[tox]

envlist = py311,py312,py313,py314,py311-fallback,doc
skip_missing_interpreters = True
toxworkdir = .tox
isolated_build = true
requires = pip>=20.2

[testenv]
changedir = tests
deps = -r pip_requirements_export.txt
# "python -m" ensures that the env's own pip/pytest are used, never ones from an outer virtualenv in PATH
uv_seed = true
commands =
    python -c "import sys; print(sys.version)"
    # Pure-python fallback backend, like on iOS: everything not needing pycryptodome
    fallback: python -m pip uninstall -y pycryptodome
    fallback: python -m pytest -vl --tb=long -m "not requires_pycryptodome"
    !fallback: python -m pytest -vl --tb=long

[testenv:doc]
# see http://tox.readthedocs.io/en/latest/example/general.html#integrating-sphinx-documentation-checks
basepython = python3.11
changedir = docs
deps = -r pip_requirements_export.txt
commands =
    python -m sphinx -W -b html -d "{envtmpdir}/doctrees" . "{envtmpdir}/html"

[testenv:c_flightbox]
# Flightbox C encryptor, on Linux or WSL with CMake, GCC, Clang (with libFuzzer) and arm-none-eabi-gcc: every build
# with its unit tests, fuzz smoke runs and Cortex-M4 builds, then the interop tests against wacryptolib
changedir = {toxinidir}
allowlist_externals = bash
passenv = WA_CC, WA_CLANG, WA_FUZZ_SECONDS, WA_CMAKE_GENERATOR
setenv =
    WA_PYTHON = {envpython}
    WA_BUILD_ROOT = {env:WA_BUILD_ROOT:{toxinidir}/reimplementations/c-language/build}
    WA_FLIGHTBOX_C_BUILD_DIR = {env:WA_BUILD_ROOT:{toxinidir}/reimplementations/c-language/build}/gcc_mbedtls:{env:WA_BUILD_ROOT:{toxinidir}/reimplementations/c-language/build}/gcc_wolfcrypt
commands =
    bash reimplementations/c-language/build_and_test_all_backends.sh
    python -m pytest reimplementations/c-language/tests/interop

[testenv:rust_flightbox]
# Flightbox Rust encryptor, on Linux or WSL with Rust (the pinned stable toolchain, and a nightly one with cargo-fuzz),
# libclang, cargo-deny and arm-none-eabi binutils: every build with its tests, fuzz smoke runs and Cortex-M builds,
# then the interop tests against wacryptolib, with the C builds too when "tox -e c_flightbox" has made them
changedir = {toxinidir}
allowlist_externals = bash
passenv = WA_FUZZ_SECONDS, WA_WOLFSSL_SOURCE_DIR, WA_NO_FETCH, WA_C_BUILD_ROOT, WA_REQUIRE_ALL_STEPS, LIBCLANG_PATH, BINDGEN_EXTRA_CLANG_ARGS, CARGO_HOME, RUSTUP_HOME, RUSTUP_TOOLCHAIN
setenv =
    WA_PYTHON = {envpython}
    WA_BUILD_ROOT = {env:WA_BUILD_ROOT:{toxinidir}/reimplementations/rust/target/all}
commands =
    bash reimplementations/rust/build_and_test_all_backends.sh
    bash -c 'WA_FLIGHTBOX_C_BUILD_DIR="$(cat "$WA_BUILD_ROOT/interop_build_dirs.txt")" "$WA_PYTHON" -m pytest reimplementations/c-language/tests/interop'
