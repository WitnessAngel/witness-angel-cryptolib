[tox]

envlist = py311,py312,py313,py314,py311-fallback,doc
skip_missing_interpreters = True
toxworkdir = .tox
isolated_build = true
requires = pip>=20.2

[testenv]
changedir = tests
deps =
# "python -m" ensures that the env's own pip/pytest are used, never ones from an outer virtualenv in PATH
uv_seed = true
commands =
    python -m pip install -r ../pip_requirements_export.txt
    # Pure-python fallback backend, like on iOS: backend-level tests, and high-level ones not needing pycryptodome
    fallback: python -m pip uninstall -y pycryptodome
    fallback: python -m pytest -vl --tb=long test_crypto_backend_parity.py test_crypto_backend_vectors.py test_crypto_backend_interop.py test_crypto_backend_selection.py test_wacryptolib_cipher.py test_wacryptolib_hash.py test_wacryptolib_signature.py test_wacryptolib_keygen.py
    !fallback: python -m pytest -vl --tb=long

[testenv:doc]
# see http://tox.readthedocs.io/en/latest/example/general.html#integrating-sphinx-documentation-checks
basepython = python3.11
changedir = docs
deps =
commands =
    python -m pip install -r ../pip_requirements_export.txt
    python -m sphinx -W -b html -d "{envtmpdir}/doctrees" . "{envtmpdir}/html"
